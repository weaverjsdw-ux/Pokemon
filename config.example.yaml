# Copy this file to config.yaml (gitignored) and fill in your real values.
#
#   cp config.example.yaml config.yaml
#
# config.yaml is in .gitignore so your addresses and webhook URL never
# get committed.

locations:
  home: "123 Main St, Springfield, IL 62701"
  work: "456 Market St, Springfield, IL 62702"

# Search radius around the driving route between home and work, in miles.
# Stores whose nearest point on the route polyline is within this distance
# are eligible for monitoring.
route_radius_miles: 4

routing:
  # "osrm" (free, no key) or "google" (needs API key, more accurate)
  engine: osrm
  # Only used if engine == google. Leave blank to fall back to OSRM.
  google_api_key: ""

# Retailers to monitor. Disable any you don't care about to cut traffic.
retailers:
  target:        { enabled: true }
  walmart:       { enabled: true }                   # Online-only signal in this build
  bestbuy:       { enabled: false, api_key: "" }   # 17/22 SKUs ready. Set enabled:true + free key (https://developer.bestbuy.com). Absent key => stays disabled, never errors.
  pokemoncenter: { enabled: false }                 # Enable after adding pokemoncenter_slug IDs
  gamestop:      { enabled: false }                 # Enable after adding gamestop_pid IDs
  costco:        { enabled: false }                 # Enable after adding costco_item_id IDs
  samsclub:      { enabled: false }                 # Placeholder; no live checks yet

# Poll interval (seconds) per retailer. Jitter is added automatically.
# Don't crank this too low — these are public site APIs, be polite.
poll_interval_seconds: 180

# Rough resale estimates shown on the product cards. The scanner refreshes
# cached estimates every 4 hours by default and flags low-confidence/high-premium
# numbers with an asterisk in the UI. eBay API credentials are optional: with
# credentials it uses the official Browse API for active asking-price comps;
# without credentials it tries public eBay search and PriceCharting fallback rows,
# which may be blocked or less consistent.
resale_prices:
  enabled: true
  interval_seconds: 14400
  ebay:
    marketplace_id: EBAY_US
    browse_api_token: ""   # or EBAY_BROWSE_API_TOKEN / EBAY_OAUTH_TOKEN
    client_id: ""          # or EBAY_CLIENT_ID
    client_secret: ""      # or EBAY_CLIENT_SECRET

# --- Phase 1 deal intelligence: fee-adjusted BUY/THIN/SKIP verdicts on alerts ---
# Resale comps are context for MSRP-protection decisions, never a scalping target.
deal_intelligence:
  tax_rate: 0.07            # cost-basis sales-tax multiplier (Indiana default)
  fees:
    ebay_fvf_pct: 0.1325    # eBay trading-card final value fee (incl. payment processing)
    ebay_fixed_fee: 0.40    # eBay per-order fixed fee
    ebay_est_shipping: 8.00 # seller-paid shipping estimate per sealed item (~2lb); per-product 'est_shipping' overrides
    local_haircut_pct: 0.15 # local/FB sells below online comp by this fraction
  verdict:
    skip_floor_net: 5.00
    buy_floor_net: 15.00
    roi_gate_enabled: true
    skip_floor_roi: 10
    buy_floor_roi: 20
    min_buy_confidence: medium   # comps weaker than this never show BUY

# --- Money Hypothesis Lab (Phase C) business policy ---
# NOTE: fees, tax, shipping, and the PAPER buy floor are NOT re-declared here — they
# are cited from deal_intelligence above (correct units + the $0.40 fixed fee) so an
# opportunity's expected net/ROI matches exactly what the alert path shows. Only
# genuinely-new business policy lives here. Unset per-type values below surface as
# TBD_OPERATOR_POLICY and are never invented.
opportunity:
  live_min_expected_net: 25.00   # TBD_OPERATOR_POLICY — stricter than the paper $15 floor
  live_min_roi_pct: 30.0         # TBD_OPERATOR_POLICY — stricter than the paper 20% floor
  live_min_confidence: medium    # TBD_OPERATOR_POLICY — confidence floor to mark LIVE_PACKET_ELIGIBLE
  stale_after_days: 30           # governs opportunity staleness; the /momentum
                                 # endpoint still uses poke.staleness_days — keep them
                                 # equal unless you intend different staleness per surface
  max_hold_days:                 # expected hold per trade type (unset types => TBD_OPERATOR_POLICY)
    sealed_retail_arbitrage: 45
    sealed_momentum_watch: 90
  exit_venue:                    # assumed resale venue per trade type (unset => TBD_OPERATOR_POLICY)
    sealed_retail_arbitrage: ebay
    sealed_momentum_watch: ebay
  # Still TBD_OPERATOR_POLICY (not yet modeled — set when the operator decides):
  #   - max acceptable buy price per candidate/trade-type
  #   - per-trade-type confidence-floor overrides (live_min_confidence is global today)

# Optional external card-price market source. Optional-preferred, never required:
# scanning runs fully without it. Free tier ~100 credits/day < full-catalog need,
# so keep preferred:false + 24h TTL on free tier, or pay Standard for 4h cadence.
market:
  preferred: false
  api_key: ""               # or CARD_PRICE_API_KEY env var; PPT_API_KEY is legacy compat
  cache_ttl_seconds: 86400  # 24h on free tier; lower only on a paid tier

# --- /poke AI deal-research pipeline (discovery sweeps) ---
# Discovery is a sibling to the scanner; comps are anchored to the same backbone.
poke:
  min_rows: 10              # golden-test floor; a sweep below this is "likely acquisition failure"
  staleness_days: 30        # a comp older than this is flagged stale, excluded from STEAL
  steal_pct: 30             # a VERIFIED deal at/above this % off market is STEAL-eligible
  min_discount_pct: 5       # below this % off market it is not a deal row
  grading_cost_all_in: 97.50  # live PSA tier all-in (value tiers paused 2026-06; config, not hardcoded)
  buy_basis: msrp           # sealed-board deal-price basis ("observed" last-seen retail is a future hook)
  daily_credit_cap: 90      # PPT credits per sweep run; past this, remaining products use the resale fallback

# Discord webhook URL. See README for the 30-second setup walkthrough.
# Leave blank for console-only output.
discord_webhook: ""

# Optional: ntfy.sh topic for free mobile push as a backup channel.
# https://ntfy.sh — just pick a unique topic name and subscribe on your phone.
ntfy_topic: ""

# Which TCG products to track. "all_tcg" and "all_sealed" both cover every SKU
# in data/products.yaml. Use "pokemon", "magic", or an explicit list of product
# keys when you only want part of the catalog.
products: all_tcg

# In-house comp engine (TCGplayer + PriceCharting + eBay triangulation).
comps:
  engine: legacy            # 'inhouse' = multi-source comp engine (Slice 6 flips default)
  agreement_tolerance_pct: 20
  ebay_floor_sanity_pct: 50
  cache_ttl_seconds: 21600  # 6h
  politeness_seconds: 1.0   # min gap between live source fetches

# Discovery lane (candidate deals beyond the tracked catalog). Slice 3 ships
# the adapters; the scheduled pipeline that consumes them lands in Slice 4.
discovery:
  enabled: true
  interval_seconds: 7200    # 2h between discovery refreshes
  sources: [target_search, slickdeals, ebay_browse]   # target_search + trackalacker are
                            # Playwright-gated stubs until the wave-2 dependency decision
  set_watch: ["Prismatic Evolutions", "Destined Rivals", "Journey Together",
              "Surging Sparks", "Scarlet & Violet 151", "Paldean Fates", "Crown Zenith"]
  min_alert_confidence: medium   # Ring-3 wildcard candidates need at least this comp confidence

# Deal-alert dedupe + quiet hours for the discovery pipeline (Slice 4).
alerts:
  quiet_hours: "23:00-08:00"     # local HH:MM-HH:MM; ntfy pushes suppressed in-window
                                 # (board + manifest still written; Discord still posts)
  price_drop_realert_pct: 5      # re-alert a live listing when its price drops >= this %
  cooldown_hours: 24             # otherwise no repeat alert for the same listing until this elapses
