# =================================================================================
# Set-coverage extension (2026-09-17) — the four Pokémon sets the sealed lane already
# tracks in data/products.yaml that had ZERO singles coverage: Crown Zenith, Destined
# Rivals, Journey Together, Paldean Fates. Purpose is price EVIDENCE: the comp path is
# already built, it just had almost nothing to run on (5 distinct cards / 3 sets).
#
# Selection rule (not vibes): each set's products were enumerated from its TCGCSV group
# (the authoritative, keyless, 0-credit product list), filtered to priced singles with a
# single unambiguous subTypeName (the "clean single Holofoil subtype" precedent set by
# sylveon_ex_156_raw_nm), then sampled across the set's own price regime — chase / mid /
# low-tier — so the catalog measures more than one price band.
#
# Each card is tagged `famous` or `obscure` on its first row: entity familiarity is a
# stratification axis any future evaluation would need, and it costs nothing to record now.
#
# Every id below was verified live 2026-09-17: tcgplayer_id + tcgcsv_group_id come from
# the group's own /products response (the group stamped is the one that actually returned
# the productId — Crown Zenith spans TWO groups, 17688 main and 17689 Galarian Gallery);
# a pricecharting_slug is written ONLY where the path resolved 200 with the full six-cell
# #price_data layout. Where it did not, the field is OMITTED — an honest `none` comp, per
# the header rule above. Market prices in comments are TCGCSV marketPrice on 2026-09-17,
# recorded as selection provenance (tier evidence), NOT as a comp.
#
# KNOWN PARSER INTERACTION (pre-existing, NOT worked around here): cards whose name
# contains an apostrophe render it as `&#39;` in the PriceCharting page <h1>/<title>, so
# pricecharting_page_number_from_html() returns "39" instead of the real card number. The
# F.1 wrong-slug guard (_slug_number_mismatch) then sees 39 != the asset card_number and
# records nothing. The slugs below ARE correct (h1 confirmed by hand); the suppression is
# a false negative in the parser, not a bad mapping. Affected here: Team Rocket's Mewtwo
# ex 231, Cynthia's Garchomp ex 232, Lillie's Clefairy ex 184. Every set therefore also
# carries apostrophe-free cards that resolve today. Reported, not fixed — scanner/ logic
# is out of this change's scope.
# =================================================================================

