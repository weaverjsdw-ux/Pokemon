# The scanner queries each enabled retailer using the IDs listed here.
#
# Add new products as sets release. Common ID sources:
#   - Target: "TCIN" — visible in the product URL or page source.
#   - Walmart: numeric "itemId" — visible in product URL.
#   - Best Buy: "SKU" — visible in product URL.
#   - GameStop: "productId" — visible in product URL.
#   - Pokémon Center: URL slug, e.g. "pokemon-tcg-scarlet-violet-..."
