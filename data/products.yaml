# TCG sealed product catalog.
#
# Each product entry maps a friendly name -> per-retailer SKUs/identifiers.
# The scanner queries each enabled retailer using the IDs listed here.
#
# Add new products as sets release. Common ID sources:
#   - Target: "TCIN" — visible in the product URL or page source.
#   - Walmart: numeric "itemId" — visible in product URL.
#   - Best Buy: "SKU" — visible in product URL.
#   - GameStop: "productId" — visible in product URL.
#   - Pokemon Center: URL slug, e.g. "pokemon-tcg-scarlet-violet-..."
#
#   - Costco: parent item number - visible in product URL before ".html".
#
# Tip: search the product page HTML for "tcin", "itemId", or "sku" to grab
# the exact ID without guessing.

