<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Scanner</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <h1>Pokemon Scanner</h1>
          <p id="statusText">Loading scanner status...</p>
        </div>
        <div class="actions">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="dryRunBtn" type="button">Dry Run</button>
          <button id="scanOnceBtn" type="button">Scan Once</button>
          <button id="startBtn" type="button">Start Interval</button>
          <button id="stopBtn" type="button" class="secondary">Stop</button>
        </div>
      </section>

      <section class="grid">
        <form id="configForm" class="panel config-panel">
          <div class="panel-title">
            <h2>Config</h2>
            <button id="saveBtn" type="submit">Save</button>
          </div>
          <label>
            Home address
            <input id="homeAddress" name="homeAddress" autocomplete="street-address" required>
          </label>
          <label>
            Work address
            <input id="workAddress" name="workAddress" autocomplete="street-address" required>
          </label>
          <div class="row">
            <label>
              Radius miles
              <input id="routeRadiusMiles" name="routeRadiusMiles" type="number" min="0.5" step="0.5" required>
            </label>
            <label>
              Poll seconds
              <input id="pollIntervalSeconds" name="pollIntervalSeconds" type="number" min="60" step="1" required>
            </label>
          </div>
          <label>
            Routing engine
            <select id="routingEngine" name="routingEngine">
              <option value="osrm">OSRM</option>
              <option value="google">Google</option>
            </select>
          </label>
          <label>
            Discord webhook
            <input id="discordWebhook" name="discordWebhook" type="password" placeholder="Leave blank to keep console-only">
          </label>
          <label>
            ntfy topic
            <input id="ntfyTopic" name="ntfyTopic" placeholder="Optional mobile push topic">
          </label>
        </form>

        <section class="panel">
          <div class="panel-title">
            <h2>Retailers</h2>
            <span id="productCount" class="pill">0 products</span>
          </div>
          <div id="retailerList" class="retailer-list"></div>
        </section>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>Products Being Scanned</h2>
          <span id="scanCoverage" class="pill">0 active</span>
        </div>
        <div id="productList" class="product-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>Interval Scanner</h2>
          <span id="runnerState" class="pill">idle</span>
        </div>
        <div id="runnerStats" class="runner-stats"></div>
        <div id="errorList" class="errors"></div>
        <div id="stores" class="stores"></div>
        <div id="alerts" class="alerts"></div>
        <pre id="logOutput" class="log"></pre>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
